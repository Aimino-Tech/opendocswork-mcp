name: ppt.deck
version: "1.0.0"
description: "Presentation from outline with title slides, content slides, section breaks"
category: ppt
format: pptx
author: "office-oxide-mcp"
icon: "presentation"

inputs:
  - name: title
    type: string
    description: "Presentation title"
    required: true
  - name: subtitle
    type: string
    description: "Presentation subtitle"
    required: false
    default: ""
  - name: author
    type: string
    description: "Author name"
    required: false
    default: ""
  - name: slides
    type: array
    description: "Array of slide definitions: [{type, title, content, notes?}]"
    required: true
  - name: theme
    type: string
    description: "Presentation theme (professional, modern, dark, light)"
    required: false
    default: "professional"
  - name: include_slide_numbers
    type: boolean
    description: "Include slide numbers"
    required: false
    default: true

outputs:
  - name: file_path
    type: string
    description: "Path to the generated PowerPoint file"
  - name: slide_count
    type: integer
    description: "Number of slides created"
  - name: slide_types
    type: array
    description: "Types of slides created (title, content, section, thank_you)"

templates:
  primary: "ppt.deck"
  description: "Presentation template with slide masters, layouts, and theme colors"

placeholders:
  - name: "{{TITLE}}"
    type: string
    description: "Presentation main title"
  - name: "{{SUBTITLE}}"
    type: string
    description: "Presentation subtitle"
  - name: "{{AUTHOR}}"
    type: string
    description: "Author name on title slide"
  - name: "{{SLIDES}}"
    type: array
    description: "Slide content array with types, titles, and bodies"
  - name: "{{THEME_COLOR}}"
    type: string
    description: "Primary theme color hex code"
  - name: "{{THEME_DARK}}"
    type: string
    description: "Dark variant of theme color"

formatting:
  font:
    family: "Calibri"
  title_slide:
    title_font_size: 44
    title_color: "FFFFFF"
    subtitle_font_size: 20
    subtitle_color: "B0D0F0"
    background: "1F3864"
  content_slide:
    title_font_size: 28
    title_color: "1F3864"
    body_font_size: 18
    body_color: "333333"
    background: "FFFFFF"
  section_slide:
    title_font_size: 36
    title_color: "FFFFFF"
    background: "2E75B6"
  thank_you_slide:
    title_font_size: 40
    title_color: "FFFFFF"
    background: "1F3864"
  body:
    font_size: 18
    line_spacing: 1.5
  bullet:
    font_size: 16
    indent_levels:
      - left_margin: 72
      - left_margin: 144
      - left_margin: 216

validation:
  rules:
    - name: title_not_empty
      type: assert
      field: title
      message: "Presentation title must not be empty"
    - name: slides_not_empty
      type: assert
      field: slides
      message: "At least one slide is required"
    - name: slides_have_title
      type: custom
      field: slides
      message: "Each slide must have a title"
    - name: slides_have_type
      type: custom
      field: slides
      message: "Each slide must have a type"
    - name: slide_types_valid
      type: custom
      field: slides
      message: "Slide type must be one of: title, content, section, thank_you"
    - name: theme_valid
      type: enum
      field: theme
      values: ["professional", "modern", "dark", "light"]
      message: "Theme must be one of: professional, modern, dark, light"
