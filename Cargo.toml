[package]
name = "office-oxide-mcp"
version = "0.2.0"
edition = "2021"
description = "Rust-native MCP server for Office document processing (Excel, Word, PowerPoint, PDF). Sub-millisecond, local-first, open source alternative to Aspose."
homepage = "https://github.com/Aimino-Tech/office-oxide-mcp"
repository = "https://github.com/Aimino-Tech/office-oxide-mcp"
documentation = "https://github.com/Aimino-Tech/office-oxide-mcp"
readme = "README.md"
keywords = ["mcp", "office", "ooxml", "excel", "word", "powerpoint", "pdf"]
categories = ["command-line-utilities", "development-tools::mcp"]
license = "MIT OR Apache-2.0"
exclude = [
    ".editorconfig",
    "docker-compose.yml",
]
rust-version = "1.93"

[package.metadata.docs.rs]
features = ["all-features"]
rustc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-gnu"]

[dependencies]
rmcp = { version = "1.7", features = ["server", "client", "macros", "transport-io", "transport-child-process", "schemars"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rdocx = "0.1"
zip = { version = "2", features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "fmt"] }
rust_xlsxwriter = { version = "=0.94.0", features = ["zlib", "constant_memory"] }
quick-xml = "0.37"
calamine = "0.26"
regex = "1"
async-trait = "0.1"
office_oxide = "0.1"
serde_yaml = "0.9"
lopdf = "0.35"
printpdf = "0.8"
similar = "2"
rayon = "1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
lopdf = { path = "vendor/lopdf" }
